services:
  # ─── Express Backend Service ───────────────────────────────────────────────
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: habitrek-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ./server/.env
    environment:
      - PORT=8080
      - NODE_ENV=production
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://18.234.66.155,http://localhost,http://localhost:5173,http://localhost:80}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
    networks:
      - habitrek-network

  # ─── React Vite + Nginx Frontend Service ────────────────────────────────────
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: habitrek-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - habitrek-network

  # ─── Optional Local MongoDB (Uncomment to use local DB instead of Atlas) ───
  # mongo:
  #   image: mongo:7.0
  #   container_name: habitrek-mongo
  #   restart: unless-stopped
  #   ports:
  #     - "27017:27017"
  #   volumes:
  #     - mongo-data:/data/db
  #   networks:
  #     - habitrek-network

networks:
  habitrek-network:
    driver: bridge

